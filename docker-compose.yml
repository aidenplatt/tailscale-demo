# ---------------------------------------------------------------------------
# Two nodes:
#   - "web"    : an nginx service, only reachable over Tailscale (tag:server)
#   - "client" : my own laptop, tagged tag:client in the Tailscale admin
#                console, used to prove/validate connectivity - NOT a
#                container in this setup
#
# The web container publishes no ports to the host. The ONLY way to reach
# it is through the tailnet, from a device (like my laptop) permitted by
# the ACL policy in policy.hujson.
# ---------------------------------------------------------------------------

services:
  web:
    image: nginx:alpine
    container_name: ts-web
    hostname: web
    volumes:
      - ./web-content:/usr/share/nginx/html:ro
    networks:
      - internal
    # no "ports:" mapping on purpose - not reachable from the host/public net

  web-tailscale:
    image: tailscale/tailscale:latest
    container_name: ts-web-sidecar
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY_SERVER}
      - TS_EXTRA_ARGS=--advertise-tags=tag:server --hostname=web
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ts-web-state:/var/lib/tailscale
    network_mode: service:web
    depends_on:
      - web

networks:
  internal:
    driver: bridge

volumes:
  ts-web-state: